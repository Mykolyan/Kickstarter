<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Luna</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
  </head>
  <body>
    <header class="header">
      <div class="header__container page__container">
        <a
          href="#"
          class="header__logo"
        >
          <img
            src="src/images/Logo.svg"
            alt="Luna"
            width="161"
            height="26"
          />
        </a>

        <nav
          class="nav"
          aria-label="Main"
        >
          <a
            href="#specs"
            class="nav__link"
          >
            Specs
          </a>

          <div class="nav__lang lang">
            <a
              href="#"
              class="lang__link lang__link--active"
              hreflang="en"
            >
              EN
            </a>
            <span class="lang__divider">/</span>
            <a
              href="#"
              class="lang__link"
              hreflang="uk"
            >
              UA
            </a>
          </div>

          <a
            href="#buy"
            class="button button--dark"
          >
            Buy
          </a>
        </nav>

        <button
          class="header__burger"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="menu"
        >
          <span class="header__burger-line"></span>
        </button>
      </div>

      <nav
        class="menu"
        id="menu"
        aria-label="Sections"
      >
        <a
          href="#our-story"
          class="menu__link"
        >
          Our story
        </a>
        <a
          href="#about-us"
          class="menu__link"
        >
          About us
        </a>
        <a
          href="#features"
          class="menu__link"
        >
          Features
        </a>
        <a
          href="#get-in-touch"
          class="menu__link"
        >
          Get in touch
        </a>

        <!-- Mobile only: the inline header nav is hidden on mobile -->
        <div class="menu__extra">
          <a
            href="#specs"
            class="menu__link"
          >
            Specs
          </a>

          <div class="lang">
            <a
              href="#"
              class="lang__link lang__link--active"
              hreflang="en"
            >
              EN
            </a>
            <span class="lang__divider">/</span>
            <a
              href="#"
              class="lang__link"
              hreflang="uk"
            >
              UA
            </a>
          </div>

          <a
            href="#buy"
            class="button button--dark"
          >
            Buy
          </a>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div class="hero__container page__container">
          <picture class="hero__picture">
            <source
              media="(min-width: 1280px)"
              srcset="src/images/hero/hero-desktop.png"
            />
            <source
              media="(min-width: 640px)"
              srcset="src/images/hero/hero-tablet.png"
            />
            <img
              class="hero__image"
              src="src/images/hero/hero-mobile.png"
              alt="Two Luna wireless speakers"
              width="320"
              height="245"
            />
          </picture>

          <div class="hero__content">
            <h1 class="hero__title">Futuristic Wireless Speaker</h1>
            <p class="hero__text">
              Luna’s performance is balanced and smooth in all frequency ranges
              which makes the music both naturally pleasant and distinctly more
              layered.
            </p>
          </div>
        </div>
      </section>
    </main>

    <script src="src/scripts/main.js"></script>
  </body>
</html>
